name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Job names are referenced by branch protection; rename both together.
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt

      - name: Django system checks
        run: python manage.py check

      - name: Production settings check (DEBUG off)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: cn331-foldo.onrender.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Coverage gate (>= 80%)
        run: coverage report

  lint:
    name: Lint & security
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tools
        run: pip install -r requirements-ci.txt

      - name: Flake8 (PEP 8, unused code)
        run: flake8 apps config

      - name: Bandit (security scan, medium severity and above)
        run: bandit -r apps config -ll -x "*/migrations/*,*/tests.py,*/test_*.py"

      - name: Black (formatting)
        run: black --check --diff apps config
