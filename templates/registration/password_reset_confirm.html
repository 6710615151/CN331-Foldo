{% extends "base.html" %}
{% block content %}
{% if validlink %}
  <h2>Set a New Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Change Password</button>
  </form>
{% else %}
  <h2>Link Invalid </h2>
  <p>
    This password reset link is invalid, possibly because it has already
    been used or has expired.
  </p>
  <p><a href="{% url 'accounts:password_reset' %}">Request a new reset link</a></p>
{% endif %}
{% endblock %}
