{% extends "base.html" %}

{% block title %}Log In — FOLDO{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      
      <div class="card shadow border-0 mb-4">
        <div class="card-body p-4 p-md-5">
          <h2 class="h3 mb-4 text-center fw-bold">Log In</h2>

          {% if form.errors %}
            <div class="alert alert-danger p-3 mb-4 rounded-3" role="alert">
              Your username and password didn't match. Please try again.
            </div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            
            <!-- Default Django form render -->
            <div class="mb-4">
              {{ form.as_p }}
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            
            <div class="d-grid">
              <button type="submit" class="btn btn-primary py-2 fw-semibold">Log In</button>
            </div>
          </form>
          
        </div>
      </div>

      <!-- Links below the card -->
      <div class="text-center">
        <p class="mb-2">
          <a href="{% url 'accounts:password_reset' %}" class="text-decoration-none">Forgot your password?</a>
        </p>
        <p>
          Don't have an account? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-bold">Sign up</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
