{% extends "base.html" %}

{% block title %}Check Your Email — FOLDO{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      
      <div class="card shadow border-0 mb-4">
        <div class="card-body p-4 p-md-5 text-center">
          <h2 class="h3 mb-3 fw-bold">Check Your Email</h2>
          <p class="mb-0 opacity-75">
            If an account exists with that email address, we've sent a link to reset your password. It should arrive within a few minutes.
          </p>
        </div>
      </div>

      <div class="text-center">
        <p>
          <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-bold">Back to login</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
