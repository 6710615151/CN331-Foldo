{% extends "base.html" %}

{% block title %}Password Changed — FOLDO{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      
      <div class="card shadow border-0 mb-4">
        <div class="card-body p-4 p-md-5 text-center">
          <!-- Added text-success for a positive visual confirmation -->
          <h2 class="h3 mb-3 fw-bold text-success">Password Changed</h2>
          <p class="mb-0 opacity-75">
            Your password has been set. You can now log in with your new password.
          </p>
        </div>
      </div>

      <div class="text-center">
        <p>
          <a href="{% url 'accounts:login' %}" class="btn btn-primary py-2 px-4 fw-semibold mt-2">Log in</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}
