{% extends "base.html" %}

{% block title %}Access denied — FOLDO{% endblock %}

{% block content %}
<section class="foldo-section">
  <div class="container">
    <div class="foldo-state">
      <p class="foldo-state__code">403</p>
      <h1 class="foldo-section__title">You don't have access to this page</h1>
      <p class="foldo-section__subtitle">
        This page belongs to another account, or you need different permissions.
      </p>
      <a class="btn btn-foldo mt-2" href="{% url 'core:landing' %}">Back to dashboard</a>
    </div>
  </div>
</section>
{% endblock %}
