{% if skills %}
  <section class="card pf-card border-0 mb-4" aria-labelledby="skills-heading">
    <div class="card-body p-4">
      <h2 id="skills-heading" class="h5 pf-heading">Skills</h2>
      <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0">
        {% for skill in skills %}
          <li>
            <span class="badge rounded-pill text-bg-secondary fw-normal fs-6">
              {{ skill.name }} <span class="opacity-75">&middot; {{ skill.get_proficiency_display }}</span>
            </span>
          </li>
        {% endfor %}
      </ul>
    </div>
  </section>
{% endif %}
