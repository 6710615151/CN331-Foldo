{# Confirm-delete popup. Needs: key, pk, delete_url, item_label, kind. #}
<div class="modal fade foldo-modal" id="delete-{{ key }}-{{ pk }}" tabindex="-1" aria-labelledby="delete-{{ key }}-{{ pk }}-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{{ delete_url }}" data-loading>
        {% csrf_token %}
        <div class="modal-header border-0 pb-0">
          <h2 class="modal-title h5" id="delete-{{ key }}-{{ pk }}-title">Delete {{ kind }}?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <strong>{{ item_label }}</strong> will be removed from this profile. This can't be undone.
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-danger" data-loading-text="Deleting…">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
